openapi: 3.1.0
info:
  title: template-ts7 API
  version: 0.1.0
  description: >
    Scaffold API surface. `health` is the canonical reference feature;
    `echo` exists only to demonstrate the request-validation middleware.
    Hand-written and kept in sync manually — see CONTRIBUTING.md.
servers:
  - url: http://localhost:3000/api

# No auth exists anywhere in this scaffold (intentionally — see CLAUDE.md).
# Declared explicitly rather than left implicit.
security: []

paths:
  /health:
    get:
      summary: Report process liveness and dependency status
      operationId: getHealth
      responses:
        '200':
          description: >
            Server is ok (no dependency has explicitly reported unhealthy;
            'unknown' does not degrade the status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessResponse'
        '503':
          description: Degraded — at least one dependency explicitly reported unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /echo:
    post:
      summary: Validation-pattern demo endpoint — echoes the message back with its length
      description: >
        Not a template for real features; demonstrates validate.middleware.ts.
        See CLAUDE.md.
      operationId: postEcho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoRequest'
      responses:
        '200':
          description: Echoed message and its length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            details: {}

    DependencyCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, unhealthy, unknown]
        message:
          type: string

    HealthStatus:
      type: object
      required: [status, uptimeSeconds, timestamp, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptimeSeconds:
          type: number
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DependencyCheck'

    HealthSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/HealthStatus'

    EchoRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500

    EchoResponseBody:
      type: object
      required: [message, length]
      properties:
        message:
          type: string
        length:
          type: integer

    EchoSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/EchoResponseBody'

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
